<div class="sidebar glass-navbar h-100 p-3" style="width: 250px; min-height: 100vh;">
    <div class="d-flex align-items-center mb-4">
        <i class="fas fa-tractor fa-2x text-primary me-2"></i>
        <span class="fs-4 fw-bold text-white">Gestão Rural</span>
    </div>
    <hr class="text-white-50">
    <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item mb-2">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                class="nav-link text-white d-flex align-items-center">
                <i class="fas fa-home me-2"></i> Início
            </a>
        </li>

        @if (isLoggedIn) {
        <li class="nav-item mb-2">
            <a routerLink="/animais" routerLinkActive="active" class="nav-link text-white d-flex align-items-center">
                <i class="fas fa-cow me-2"></i> Animais
            </a>
        </li>
        <li class="nav-item mb-2">
            <a routerLink="/producao" routerLinkActive="active" class="nav-link text-white d-flex align-items-center">
                <i class="fas fa-chart-line me-2"></i> Produção
            </a>
        </li>
        <li class="nav-item mb-2">
            <a routerLink="/financeiro" routerLinkActive="active" class="nav-link text-white d-flex align-items-center">
                <i class="fas fa-wallet me-2"></i> Financeiro
            </a>
        </li>
        <li class="nav-item mb-2">
            <a routerLink="/saude" routerLinkActive="active" class="nav-link text-white d-flex align-items-center">
                <i class="fas fa-heartbeat me-2"></i> Saúde Animal
            </a>
        </li>
        <li class="nav-item mb-2">
            <a routerLink="/relatorios" routerLinkActive="active" class="nav-link text-white d-flex align-items-center">
                <i class="fas fa-file-alt me-2"></i> Relatórios
            </a>
        </li>
        }
    </ul>

    @if (isLoggedIn) {
    <hr class="text-white-50">
    <div class="d-flex align-items-center text-white-50 small mb-2">
        <i class="fas fa-user me-2"></i>
        <span>{{ userName }}</span>
    </div>
    <button (click)="onLogout()" class="btn btn-outline-danger btn-sm w-100">
        <i class="fas fa-sign-out-alt me-1"></i> Sair
    </button>
    }
</div>
