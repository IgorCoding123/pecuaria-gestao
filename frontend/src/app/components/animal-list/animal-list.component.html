<div class="animate__animated animate__fadeIn">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-gradient">Gestão de Animais</h2>
        <a routerLink="/animal-form" class="btn btn-primary btn-rounded shadow-sm">
            <i class="fas fa-plus me-2"></i> Novo Animal
        </a>
    </div>

    <div class="glass-card">
        <div class="table-responsive">
            <table class="table table-hover text-white mb-0">
                <thead>
                    <tr class="text-white-50">
                        <th>Nome/ID</th>
                        <th>Tipo</th>
                        <th>Idade</th>
                        <th>Finalidade</th>
                        <th>Quantidade</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    @for (animal of animais; track animal.id) {
                    <tr>
                        <td>
                            <div class="fw-bold">{{ animal.nome }}</div>
                            <div class="small text-white-50">#{{ animal.id }}</div>
                        </td>
                        <td><span class="badge badge-info">{{ animal.tipo }}</span></td>
                        <td>{{ animal.idade }}</td>
                        <td>{{ animal.finalidade }}</td>
                        <td>{{ animal.quantidade }}</td>
                        <td class="text-end">
                            <button [routerLink]="['/animal-form', animal.id]"
                                class="btn btn-link btn-sm text-white me-2">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button (click)="deleteAnimal(animal.id!)" class="btn btn-link btn-sm text-danger">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                    } @empty {
                    <tr>
                        <td colspan="6" class="text-center py-5">
                            <div class="text-white-50">Nenhum animal cadastrado ainda.</div>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
