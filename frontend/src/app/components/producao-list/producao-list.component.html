<div class="animate__animated animate__fadeIn">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-gradient">Gestão de Produção</h2>
        <a routerLink="/producao-form" class="btn btn-primary btn-rounded shadow-sm">
            <i class="fas fa-plus me-2"></i> Registrar Produção
        </a>
    </div>

    <div class="glass-card">
        <div class="table-responsive">
            <table class="table table-hover text-white mb-0">
                <thead>
                    <tr class="text-white-50">
                        <th>Data</th>
                        <th>Tipo</th>
                        <th>Quantidade</th>
                        <th>Animal Associado</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    @for (p of producoes; track p.id) {
                    <tr>
                        <td>{{ p.data | date:'dd/MM/yyyy' }}</td>
                        <td>
                            <span class="badge" [ngClass]="{
                'badge-info': p.tipo === 'Leite',
                'badge-warning': p.tipo === 'Ovos',
                'badge-secondary': p.tipo === 'Lã',
                'badge-danger': p.tipo === 'Carne'
              }">{{ p.tipo }}</span>
                        </td>
                        <td><strong>{{ p.quantidade }} {{ p.unidadeMedida }}</strong></td>
                        <td>{{ p.animal ? p.animal.nome : 'Nenhum' }}</td>
                        <td class="text-end">
                            <button [routerLink]="['/producao-form', p.id]" class="btn btn-link btn-sm text-white me-2">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button (click)="deleteProducao(p.id!)" class="btn btn-link btn-sm text-danger">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                    } @empty {
                    <tr>
                        <td colspan="5" class="text-center py-5">
                            <div class="text-white-50">Nenhuma produção registrada ainda.</div>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
